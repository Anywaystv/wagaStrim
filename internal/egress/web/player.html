<!doctype html>
<meta charset="utf-8">
<title>wagaStrim player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden }
  video { width: 100%; height: 100%; object-fit: contain; display: block; background: #000 }
  #msg {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: #8a8a8a; font: 14px/1.5 system-ui, sans-serif; text-align: center; padding: 1rem;
  }
  #msg[hidden] { display: none }
</style>
<video id="v" autoplay playsinline></video>
<div id="msg">Connecting</div>
<script>
  // The receiver key is in the path, so this page is the whole configuration.
  const endpoint = location.pathname.replace("/player/", "/whep/");
  const video = document.getElementById("v");
  const msg = document.getElementById("msg");

  const say = (text) => {
    msg.textContent = text;
    msg.hidden = false;
  };

  let resource = null;
  let retry = 1000;

  // What the receiver is asked to hold before playing, in milliseconds. Enough
  // to cover the clump a frame arrives in plus a phone uplink's jitter, and
  // small enough not to put the picture visibly behind the room. It sits under
  // the playout target the daemon already applies rather than replacing it:
  // that one absorbs the network, this one keeps the decoder's cadence steady.
  const jitterTargetMS = 300;

  // sendBeacon can only POST and the teardown route is a DELETE, so nothing a
  // Browser Source did ever released its session; it sat on the server until
  // ICE timed out. keepalive is what lets the request outlive the page.
  const release = () => {
    if (resource) fetch(resource, { method: "DELETE", keepalive: true }).catch(() => {});
    resource = null;
  };

  // A retry that throws has to schedule the next one itself. Without this the
  // first failed fetch ended the loop, and the Browser Source stayed black
  // until someone reloaded it by hand. One retry at a time: a rejection that
  // arrives after the state handler already gave up would otherwise fork the
  // loop in two, and each half forks again on its next failure.
  let pending = null;
  const attempt = () => connect().catch((err) => { say(String(err)); later(); });
  const later = () => {
    if (pending) return;
    pending = setTimeout(() => { pending = null; attempt(); }, retry);
    retry = Math.min(retry * 2, 15000);
  };

  async function connect() {
    const peer = new RTCPeerConnection();

    peer.addTransceiver("video", { direction: "recvonly" });
    peer.addTransceiver("audio", { direction: "recvonly" });

    peer.ontrack = (ev) => {
      video.srcObject = ev.streams[0];
      msg.hidden = true;
      retry = 1000;
    };

    peer.onconnectionstatechange = () => {
      if (peer.connectionState === "failed" || peer.connectionState === "disconnected") {
        peer.close();
        release();
        say("Reconnecting");
        later();
      }
    };

    const offer = await peer.createOffer();
    await peer.setLocalDescription(offer);
    await new Promise((done) => {
      if (peer.iceGatheringState === "complete") return done();
      peer.onicegatheringstatechange = () =>
        peer.iceGatheringState === "complete" && done();
    });

    const res = await fetch(endpoint, {
      method: "POST",
      headers: { "content-type": "application/sdp" },
      body: peer.localDescription.sdp,
    });

    if (!res.ok) {
      peer.close();
      say(await res.text());
      later();
      return;
    }

    resource = res.headers.get("location");
    await peer.setRemoteDescription({ type: "answer", sdp: await res.text() });

    // Ask the receiver to hold a little media before playing it. WebRTC keeps
    // the smallest buffer that keeps up, which suits a conversation and not
    // this: nobody is talking back, and a camera on a phone uplink delivers a
    // frame's packets in a clump. Without it the decoder sits at the edge of
    // that jitter and stutters on every late packet. jitterBufferTarget is the
    // standard name, playoutDelayHint is what older builds understand, and a
    // build with neither ignores both.
    for (const receiver of peer.getReceivers()) {
      if (receiver.track && receiver.track.kind !== "video") continue;
      if ("jitterBufferTarget" in receiver) receiver.jitterBufferTarget = jitterTargetMS;
      else if ("playoutDelayHint" in receiver) receiver.playoutDelayHint = jitterTargetMS / 1000;
    }

    // OBS sets autoplay-policy=no-user-gesture-required, so unmuted playback
    // starts on its own there. An ordinary browser will refuse; say so rather
    // than showing a black rectangle.
    const play = () => video.play().then(() => {
      if (msg.textContent === "Click to start audio") msg.hidden = true;
    }).catch(() => say("Click to start audio"));
    play();
    document.body.onclick = play;
  }

  addEventListener("pagehide", release);

  attempt();
</script>
